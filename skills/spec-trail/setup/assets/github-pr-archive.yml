name: SpecTrail PR

on:
  pull_request:
    # Match integrationBranch and releaseBranch in docs/project/workflow.json.
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: spec-trail-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  archive:
    name: SpecTrail archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Require completed archives
        run: node .agents/skills/spec-trail/setup/scripts/check-pr.mjs
